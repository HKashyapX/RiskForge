name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.11 tests and boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install pytest numpy pydantic pyyaml

      - name: Check subsystem boundaries
        run: python scripts/lint_boundaries.py

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/unit

      - name: Compile source tree
        run: python -m compileall -q src
