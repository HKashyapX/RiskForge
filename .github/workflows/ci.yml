name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.11 tests and boundaries (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
          - platform: windows
            runner: windows-latest
          - platform: macos
            runner: macos-15-intel

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install pytest ruff httpx numpy pydantic pyyaml onnx onnxruntime fastapi psutil psycopg[binary] psycopg_pool prometheus-client

      - name: Lint API, runtime, application, persistence, review, supervision, and serving
        run: >-
          python -m ruff check
          src/riskforge/api
          src/riskforge/runtime
          src/riskforge/application
          src/riskforge/persistence
          src/riskforge/review
          src/riskforge/supervision
          src/riskforge/serving
          src/riskforge/logging_config.py
          src/riskforge/observability
          src/riskforge/authentication
          src/riskforge/ingestion
          scripts/benchmark_serving.py
          tests/unit/test_application.py
          tests/unit/test_application_inference_adapter.py
          tests/unit/test_application_workflows.py
          tests/unit/test_api_contracts.py
          tests/unit/test_api_app.py
          tests/unit/test_api_workflows.py
          tests/unit/test_persistence.py
          tests/unit/test_review_workflow.py
          tests/unit/test_runtime_contracts.py
          tests/unit/test_runtime_lifecycle.py
          tests/unit/test_runtime_demo.py
          tests/unit/test_serving.py
          tests/unit/test_serving_artifact.py
          tests/unit/test_serving_batching.py
          tests/unit/test_serving_benchmark.py
          tests/unit/test_serving_failures.py
          tests/unit/test_serving_override.py
          tests/unit/test_supervision.py
          tests/unit/test_supervision_hazards.py
          tests/unit/test_supervision_robustness.py
          tests/unit/test_supervision_pipeline.py
          tests/unit/test_supervision_reproducibility.py
          tests/unit/test_logging_config.py
          tests/unit/test_observability.py
          tests/unit/test_jwt_authentication.py
          tests/unit/test_heuristic_engine.py
          tests/unit/test_production_config.py
          tests/integration/test_onnx_runtime.py
          tests/integration/test_application_workflow_sqlite.py
          tests/integration/test_serving_benchmark.py
          tests/integration/test_persistence_sqlite.py
          tests/integration/test_review_audit_sqlite.py
          tests/integration/test_persistence_postgres.py
          tests/integration/test_auth_review_e2e.py
          tests/integration/test_resilience.py
          tests/integration/test_production_composition.py
          tests/integration/test_ingestion_api.py
          tests/contract/test_repository_protocol.py

      - name: Check subsystem boundaries
        run: python scripts/lint_boundaries.py

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/unit

      - name: Run integration tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/integration

      - name: Run architecture tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/architecture

      - name: Compile source tree
        run: python -m compileall -q src

  test-postgres:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: riskforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install pytest psycopg[binary] psycopg_pool pydantic pyyaml

      - name: Run PostgreSQL migrations
        env:
          PYTHONPATH: src
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: riskforge_test
          PGUSER: postgres
          PGPASSWORD: test_password
        run: python -m riskforge.persistence.postgres.migrate

      - name: Run PostgreSQL contract tests
        env:
          PYTHONPATH: src
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: riskforge_test
          PGUSER: postgres
          PGPASSWORD: test_password
        run: python -m pytest -v tests/contract/test_repository_protocol.py

      - name: Run PostgreSQL integration tests
        env:
          PYTHONPATH: src
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: riskforge_test
          PGUSER: postgres
          PGPASSWORD: test_password
        run: python -m pytest -v tests/integration/test_persistence_postgres.py

      - name: Run PostgreSQL migration tests
        env:
          PYTHONPATH: src
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: riskforge_test
          PGUSER: postgres
          PGPASSWORD: test_password
        run: python -m pytest -v tests/integration/test_migrations.py
