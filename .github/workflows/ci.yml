name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.11 tests and boundaries (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
          - platform: windows
            runner: windows-latest
          - platform: macos
            runner: macos-15-intel

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install pytest ruff httpx numpy pydantic pyyaml onnx onnxruntime fastapi

      - name: Lint API, runtime, application, persistence, review, supervision, and serving
        run: >-
          python -m ruff check
          src/riskforge/api
          src/riskforge/runtime
          src/riskforge/application
          src/riskforge/persistence
          src/riskforge/review
          src/riskforge/supervision
          src/riskforge/serving
          tests/unit/test_application.py
          tests/unit/test_application_inference_adapter.py
          tests/unit/test_application_workflows.py
          tests/unit/test_api_contracts.py
          tests/unit/test_api_app.py
          tests/unit/test_persistence.py
          tests/unit/test_review_workflow.py
          tests/unit/test_runtime_contracts.py
          tests/unit/test_runtime_lifecycle.py
          tests/unit/test_serving.py
          tests/unit/test_serving_artifact.py
          tests/unit/test_serving_batching.py
          tests/unit/test_serving_benchmark.py
          tests/unit/test_serving_failures.py
          tests/unit/test_serving_override.py
          tests/unit/test_supervision.py
          tests/unit/test_supervision_hazards.py
          tests/unit/test_supervision_robustness.py
          tests/unit/test_supervision_pipeline.py
          tests/unit/test_supervision_reproducibility.py
          tests/integration/test_onnx_runtime.py
          tests/integration/test_application_workflow_sqlite.py
          tests/integration/test_serving_benchmark.py
          tests/integration/test_persistence_sqlite.py
          tests/integration/test_review_audit_sqlite.py

      - name: Check subsystem boundaries
        run: python scripts/lint_boundaries.py

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/unit

      - name: Run integration tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/integration

      - name: Compile source tree
        run: python -m compileall -q src
