rules:
  - canonical: "blowout_preventer"
    entity_type: "BARRIER"
    patterns:
      - "bop"
      - "b.o.p"
      - "blowout preventer"
      - "blow out preventer"
  - canonical: "christmas_tree"
    entity_type: "ASSET"
    patterns:
      - "xtree"
      - "x-tree"
      - "xmas tree"
      - "christmas tree"
  - canonical: "swab_unit"
    entity_type: "ACTIVITY"
    patterns:
      - "swab unit"
      - "swabbing unit"
      - "swabbing"
  - canonical: "monkey_board"
    entity_type: "LOCATION"
    patterns:
      - "monkey board"
      - "m-board"
      - "mboard"
  - canonical: "well_control_line"
    entity_type: "BARRIER"
    patterns:
      - "kill line"
      - "choke line"
  - canonical: "pressure_relief_valve"
    entity_type: "BARRIER"
    patterns:
      - "prv"
      - "psv"
      - "safety valve"
      - "relief valve"
  - canonical: "energy_isolation_loto"
    entity_type: "BARRIER"
    patterns:
      - "loto"
      - "lock out tag out"
      - "lockout tagout"
  - canonical: "hydrogen_sulfide"
    entity_type: "HAZARD"
    patterns:
      - "h2s"
      - "sour gas"
      - "hydrogen sulfide"
