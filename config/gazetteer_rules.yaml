rules:
  # ── Barriers / controls (failed_barrier extraction) ─────────────────────
  - canonical: "blowout_preventer"
    entity_type: "BARRIER"
    patterns:
      - "bop"
      - "b.o.p"
      - "blowout preventer"
      - "blow out preventer"
  - canonical: "christmas_tree"
    entity_type: "ASSET"
    patterns:
      - "xtree"
      - "x-tree"
      - "xmas tree"
      - "christmas tree"
  - canonical: "well_control_line"
    entity_type: "BARRIER"
    patterns:
      - "kill line"
      - "choke line"
  - canonical: "pressure_relief_valve"
    entity_type: "BARRIER"
    patterns:
      - "prv"
      - "psv"
      - "safety valve"
      - "relief valve"
  - canonical: "energy_isolation_loto"
    entity_type: "BARRIER"
    patterns:
      - "loto"
      - "lock out tag out"
      - "lockout tagout"
      - "energy isolation"
      - "isolation loto"
  - canonical: "fall_protection_system"
    entity_type: "BARRIER"
    patterns:
      - "fall protection"
      - "fall arrest"
      - "harness"
      - "safety harness"
      - "fall restraint"
      - "lanyard"
  - canonical: "gas_detection_system"
    entity_type: "BARRIER"
    patterns:
      - "gas detector"
      - "gas detection"
      - "h2s detector"
      - "gas monitor"
      - "gas alarm"
      - "gas testing"
  - canonical: "fire_watch"
    entity_type: "BARRIER"
    patterns:
      - "fire watch"
      - "fire watcher"
      - "fire extinguisher"
      - "fire blanket"
  - canonical: "confined_space_entry_permit"
    entity_type: "BARRIER"
    patterns:
      - "entry permit"
      - "confined space permit"
      - "permit to work"
      - "ptw"
      - "work permit"
  - canonical: "barricade"
    entity_type: "BARRIER"
    patterns:
      - "barricade"
      - "barricading"
      - "barrier tape"
      - "caution tape"
      - "exclusion zone"
  - canonical: "vehicle_seatbelt"
    entity_type: "BARRIER"
    patterns:
      - "seatbelt"
      - "seat belt"
      - "safety belt"
  - canonical: "safety_instrumented_system"
    entity_type: "BARRIER"
    patterns:
      - "safety instrumented system"
      - "sis interlock"
      - "interlock"
      - "safety interlock"
      - "trip system"
  - canonical: "banksman"
    entity_type: "BARRIER"
    patterns:
      - "banksman"
      - "banksmen"
      - "spotter"
      - "flagman"
  - canonical: "breathing_apparatus"
    entity_type: "BARRIER"
    patterns:
      - "breathing apparatus"
      - "ba set"
      - "scba"
      - "respirator"
  - canonical: "grounding_bonding"
    entity_type: "BARRIER"
    patterns:
      - "earthing"
      - "grounding"
      - "bonding cable"

  # ── Hazards ──────────────────────────────────────────────────────────────
  - canonical: "hydrogen_sulfide"
    entity_type: "HAZARD"
    patterns:
      - "h2s"
      - "sour gas"
      - "hydrogen sulfide"
  - canonical: "flammable_atmosphere"
    entity_type: "HAZARD"
    patterns:
      - "flammable"
      - "combustible"
      - "explosive atmosphere"
      - "lel"
  - canonical: "pressurized_system"
    entity_type: "HAZARD"
    patterns:
      - "pressurized"
      - "pressurised"
      - "high pressure"
      - "pressure line"
  - canonical: "suspended_load"
    entity_type: "HAZARD"
    patterns:
      - "suspended load"
      - "hanging load"
      - "load overhead"
  - canonical: "unprotected_edge"
    entity_type: "HAZARD"
    patterns:
      - "unprotected edge"
      - "open edge"
      - "leading edge"
      - "floor opening"
  - canonical: "electrical_hazard"
    entity_type: "HAZARD"
    patterns:
      - "live electrical"
      - "energized"
      - "energised"
      - "electrical shock"
      - "arc flash"

  # ── Activities ───────────────────────────────────────────────────────────
  - canonical: "swab_unit"
    entity_type: "ACTIVITY"
    patterns:
      - "swab unit"
      - "swabbing unit"
      - "swabbing"
  - canonical: "hot_work"
    entity_type: "ACTIVITY"
    patterns:
      - "hot work"
      - "welding"
      - "grinding"
      - "cutting operation"
      - "gas cutting"
  - canonical: "working_at_height"
    entity_type: "ACTIVITY"
    patterns:
      - "working at height"
      - "work at height"
      - "working on the derrick"
      - "scaffold"
      - "scaffolding"
      - "ladder work"
  - canonical: "confined_space_entry"
    entity_type: "ACTIVITY"
    patterns:
      - "confined space"
      - "vessel entry"
      - "tank cleaning"
      - "cellar entry"
  - canonical: "lifting_operation"
    entity_type: "ACTIVITY"
    patterns:
      - "crane lift"
      - "lifting operation"
      - "lifting pipe"
      - "rig up"
      - "material handling"
  - canonical: "hot_tapping"
    entity_type: "ACTIVITY"
    patterns:
      - "hot tapping"
      - "hot tap"
      - "line tapping"
  - canonical: "excavation"
    entity_type: "ACTIVITY"
    patterns:
      - "excavation"
      - "digging"
      - "trenching"
  - canonical: "vehicle_transport"
    entity_type: "ACTIVITY"
    patterns:
      - "driving"
      - "vehicle driven"
      - "transport"
      - "journey management"

  # ── Locations / assets ───────────────────────────────────────────────────
  - canonical: "monkey_board"
    entity_type: "LOCATION"
    patterns:
      - "monkey board"
      - "monkeyboard"
      - "m-board"
      - "mboard"
      - "setback area"
  - canonical: "cellar"
    entity_type: "LOCATION"
    patterns:
      - "cellar"
      - "rig floor"
      - "pipe deck"
      - "catwalk"
  - canonical: "manifold_area"
    entity_type: "LOCATION"
    patterns:
      - "manifold"
      - "metering skid"
      - "wellhead area"
      - "flowline area"
  - canonical: "control_room"
    entity_type: "LOCATION"
    patterns:
      - "control room"
      - "crash cabin"
      - "dog house"
  - canonical: "storage_area"
    entity_type: "LOCATION"
    patterns:
      - "storage area"
      - "warehouse"
      - "laydown area"
      - "flammable storage"
